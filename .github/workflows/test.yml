name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install BlueZ headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Python
        run: make python-test

      - name: Rust
        run: make rust-test

      - name: C++
        run: make cpp-test
